name: Node.js CI

on:
  push: {}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mocha: [ 11, 12 ]
        node: [ 22, 24, 26 ]
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node }}
    - run: npm install --dev 'mocha@${{ matrix.mocha }}'
    - run: npx mocha --version
    - run: npm test
    - run: npm run mutate
